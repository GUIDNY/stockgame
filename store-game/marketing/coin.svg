<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="מטבע BuyToday">
  <defs>
    <radialGradient id="btc-face" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset=".35" stop-color="#ffd84d"/>
      <stop offset=".75" stop-color="#f2a900"/>
      <stop offset="1" stop-color="#c77d00"/>
    </radialGradient>
    <linearGradient id="btc-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset=".5" stop-color="#d98e00"/>
      <stop offset="1" stop-color="#8a5200"/>
    </linearGradient>
    <linearGradient id="btc-inner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe9a0"/>
      <stop offset="1" stop-color="#b86f00"/>
    </linearGradient>
  </defs>
  <!-- edge seen from slightly below, so the coin has thickness -->
  <ellipse cx="32" cy="34.5" rx="29" ry="29" fill="#7a4700"/>
  <circle cx="32" cy="32" r="29" fill="url(#btc-rim)"/>
  <circle cx="32" cy="32" r="24.5" fill="url(#btc-face)"/>
  <!-- engraved inner ring -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#btc-inner)" stroke-width="1.6"/>
  <!-- reeded edge: small notches around the rim -->
  <g stroke="#a86400" stroke-width="1.2" stroke-linecap="round" opacity=".55">
    <path d="M32 3.6v2.6M32 57.8v2.6M3.6 32h2.6M57.8 32h2.6M11.9 11.9l1.8 1.8M50.3 50.3l1.8 1.8M11.9 52.1l1.8-1.8M50.3 13.7l1.8-1.8"/>
  </g>
  <!-- the B, embossed: dark shadow under a light face -->
  <path d="M25 19.5h9.2c4.9 0 7.8 2.4 7.8 6 0 2.5-1.4 4.2-3.5 5 2.8.7 4.6 2.7 4.6 5.6 0 4.1-3.2 6.4-8.4 6.4H25z" fill="#a35f00" transform="translate(0 1.2)"/>
  <path d="M25 19.5h9.2c4.9 0 7.8 2.4 7.8 6 0 2.5-1.4 4.2-3.5 5 2.8.7 4.6 2.7 4.6 5.6 0 4.1-3.2 6.4-8.4 6.4H25z" fill="#fff2b3"/>
  <path d="M30.2 24v5.3h3.5c1.9 0 3-.9 3-2.7 0-1.7-1.1-2.6-3-2.6zm0 9.4v5.8h4.2c2.1 0 3.3-1 3.3-2.9s-1.2-2.9-3.3-2.9z" fill="#e39a00"/>
  <!-- shine -->
  <path d="M14 24c2.5-6.5 8.5-11 15.5-11.5" fill="none" stroke="#fffbe6" stroke-width="3" stroke-linecap="round" opacity=".75"/>
  <circle cx="45.5" cy="17.5" r="1.8" fill="#fffbe6" opacity=".9"/>
</svg>
